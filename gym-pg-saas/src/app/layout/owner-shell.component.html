<div class="flex min-h-screen bg-slate-50">
  <aside
    class="hidden w-60 shrink-0 flex-col border-r border-slate-200 bg-white md:flex"
  >
    <div class="border-b border-slate-100 px-4 py-5">
      <p class="text-xs font-semibold uppercase tracking-wide text-emerald-600">PayBook</p>
      <p class="mt-1 truncate text-sm font-semibold text-slate-900">{{ profile()?.name }}</p>
      <p class="truncate text-xs text-slate-500">{{ profile()?.email }}</p>
    </div>
    <nav class="flex flex-1 flex-col gap-1 p-3">
      <a
        routerLink="/dashboard"
        routerLinkActive="bg-emerald-50 text-emerald-800"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-semibold text-slate-700 hover:bg-slate-100"
      >
        <span class="material-icons-outlined">dashboard</span>
        Dashboard
      </a>
      <a
        routerLink="/members"
        routerLinkActive="bg-emerald-50 text-emerald-800"
        class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-semibold text-slate-700 hover:bg-slate-100"
      >
        <span class="material-icons-outlined">groups</span>
        Members
      </a>
      <a
        routerLink="/payments"
        routerLinkActive="bg-emerald-50 text-emerald-800"
        class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-semibold text-slate-700 hover:bg-slate-100"
      >
        <span class="material-icons-outlined">payments</span>
        Payments
      </a>
      <a
        routerLink="/rooms"
        routerLinkActive="bg-emerald-50 text-emerald-800"
        class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-semibold text-slate-700 hover:bg-slate-100"
      >
        <span class="material-icons-outlined">hotel</span>
        Rooms
      </a>
    </nav>
    <div class="border-t border-slate-100 p-3">
      <button
        type="button"
        class="flex w-full items-center justify-center gap-2 rounded-xl border border-slate-200 py-3 text-sm font-semibold text-slate-700 hover:bg-slate-50"
        (click)="signOut()"
      >
        <span class="material-icons-outlined text-lg">logout</span>
        Sign out
      </button>
    </div>
  </aside>

  <div class="flex min-w-0 flex-1 flex-col">
    <header
      class="flex items-center justify-between border-b border-slate-200 bg-white px-4 py-3 md:hidden"
    >
      <div>
        <p class="text-xs font-semibold text-emerald-600">PayBook</p>
        <p class="text-sm font-semibold text-slate-900">{{ profile()?.name }}</p>
      </div>
      <button
        type="button"
        class="rounded-lg border border-slate-200 px-3 py-2 text-sm font-semibold"
        (click)="signOut()"
      >
        Out
      </button>
    </header>
    <nav
      class="flex gap-1 overflow-x-auto border-b border-slate-200 bg-white px-2 py-2 md:hidden"
    >
      <a
        routerLink="/dashboard"
        routerLinkActive="bg-emerald-600 text-white"
        [routerLinkActiveOptions]="{ exact: true }"
        class="shrink-0 rounded-lg px-3 py-2 text-sm font-semibold text-slate-700"
        >Home</a
      >
      <a
        routerLink="/members"
        routerLinkActive="bg-emerald-600 text-white"
        class="shrink-0 rounded-lg px-3 py-2 text-sm font-semibold text-slate-700"
        >Members</a
      >
      <a
        routerLink="/payments"
        routerLinkActive="bg-emerald-600 text-white"
        class="shrink-0 rounded-lg px-3 py-2 text-sm font-semibold text-slate-700"
        >Pay</a
      >
      <a
        routerLink="/rooms"
        routerLinkActive="bg-emerald-600 text-white"
        class="shrink-0 rounded-lg px-3 py-2 text-sm font-semibold text-slate-700"
        >Rooms</a
      >
    </nav>
    <main class="flex-1 p-4 md:p-8">
      <router-outlet />
    </main>
  </div>
</div>
