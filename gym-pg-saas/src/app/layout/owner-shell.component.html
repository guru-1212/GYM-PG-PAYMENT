<div class="flex min-h-screen bg-transparent">
  <aside
    class="hidden w-64 shrink-0 flex-col border-r border-white/60 bg-white/75 backdrop-blur-xl md:sticky md:top-0 md:flex md:h-screen"
  >
    <div class="border-b border-slate-100/80 px-5 py-6">
      <p class="bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-xs font-semibold uppercase tracking-wide text-transparent">PayBook</p>
      <p class="mt-1 truncate text-sm font-semibold text-slate-900">{{ profile()?.name }}</p>
      <p class="truncate text-xs text-slate-500">{{ profile()?.email }}</p>
    </div>
    <nav class="flex flex-1 flex-col gap-1 p-3">
      <a
        routerLink="/dashboard"
        routerLinkActive="bg-indigo-50 text-indigo-800 shadow-sm"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-semibold text-slate-700 transition-all duration-200 hover:-translate-y-0.5 hover:bg-white hover:shadow-md"
      >
        <span class="material-icons-outlined">dashboard</span>
        Dashboard
      </a>
      <a
        routerLink="/members"
        routerLinkActive="bg-indigo-50 text-indigo-800 shadow-sm"
        class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-semibold text-slate-700 transition-all duration-200 hover:-translate-y-0.5 hover:bg-white hover:shadow-md"
      >
        <span class="material-icons-outlined">groups</span>
        Members
      </a>
      <a
        routerLink="/payments"
        routerLinkActive="bg-indigo-50 text-indigo-800 shadow-sm"
        class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-semibold text-slate-700 transition-all duration-200 hover:-translate-y-0.5 hover:bg-white hover:shadow-md"
      >
        <span class="material-icons-outlined">payments</span>
        Payments
      </a>
      @if (isPgOwner()) {
        <a
          routerLink="/rooms"
          routerLinkActive="bg-indigo-50 text-indigo-800 shadow-sm"
          class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-semibold text-slate-700 transition-all duration-200 hover:-translate-y-0.5 hover:bg-white hover:shadow-md"
        >
          <span class="material-icons-outlined">hotel</span>
          Rooms
        </a>
      }
    </nav>
    <div class="border-t border-slate-100 p-3">
      <button
        type="button"
        class="saas-btn-secondary flex w-full items-center justify-center gap-2 py-3 text-sm"
        (click)="signOut()"
      >
        <span class="material-icons-outlined text-lg">logout</span>
        Sign out
      </button>
    </div>
  </aside>

  <div class="flex min-w-0 flex-1 flex-col">
    <header
      class="sticky top-0 z-20 flex items-center justify-between border-b border-white/60 bg-white/85 px-4 py-3 backdrop-blur-xl md:hidden"
    >
      <div>
        <p class="bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-xs font-semibold text-transparent">PayBook</p>
        <p class="text-sm font-semibold text-slate-900">{{ profile()?.name }}</p>
      </div>
      <button
        type="button"
        class="saas-btn-secondary rounded-lg px-3 py-2 text-sm"
        (click)="signOut()"
      >
        Out
      </button>
    </header>
    <nav
      class="sticky top-[57px] z-10 flex gap-1 overflow-x-auto border-b border-white/60 bg-white/85 px-2 py-2 backdrop-blur-xl md:hidden"
    >
      <a
        routerLink="/dashboard"
        routerLinkActive="bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-md"
        [routerLinkActiveOptions]="{ exact: true }"
        class="shrink-0 rounded-lg px-3 py-2 text-sm font-semibold text-slate-700 transition-all hover:bg-slate-100"
        >Home</a
      >
      <a
        routerLink="/members"
        routerLinkActive="bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-md"
        class="shrink-0 rounded-lg px-3 py-2 text-sm font-semibold text-slate-700 transition-all hover:bg-slate-100"
        >Members</a
      >
      <a
        routerLink="/payments"
        routerLinkActive="bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-md"
        class="shrink-0 rounded-lg px-3 py-2 text-sm font-semibold text-slate-700 transition-all hover:bg-slate-100"
        >Pay</a
      >
      @if (isPgOwner()) {
        <a
          routerLink="/rooms"
          routerLinkActive="bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-md"
          class="shrink-0 rounded-lg px-3 py-2 text-sm font-semibold text-slate-700 transition-all hover:bg-slate-100"
          >Rooms</a
        >
      }
    </nav>
    <main class="flex-1 p-4 md:p-6 lg:p-8">
      <router-outlet />
    </main>
  </div>
</div>
