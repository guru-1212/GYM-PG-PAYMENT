<div class="flex min-h-screen bg-transparent dark:bg-slate-950">
  <aside
    class="hidden w-64 shrink-0 flex-col border-r border-white/60 bg-white/75 backdrop-blur-xl md:sticky md:top-0 md:flex md:h-screen dark:border-slate-700/70 dark:bg-slate-950/90 dark:backdrop-blur-xl"
  >
    <div class="border-b border-slate-100/80 px-5 py-6 dark:border-slate-800/80">
      <div class="mb-3">
        <app-brand-logo [logoSize]="'32px'" [showText]="true" brandName="Admin Portal"></app-brand-logo>
      </div>
      <div class="flex items-start justify-between gap-2">
        <!-- <div class="min-w-0 flex-1">
          <p class="text-sm font-bold tracking-tight text-slate-900">{{ 'brand.gmPg' | t }}</p>
          <p class="mt-0.5 bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-xs font-semibold uppercase tracking-wide text-transparent">
            {{ 'nav.admin' | t }}
          </p>
          <p class="mt-1 truncate text-sm font-semibold text-slate-900">{{ profile()?.name }}</p>
        </div> -->
        <!-- <app-language-switcher class="shrink-0" /> -->
      </div>
    </div>
    <nav class="flex flex-1 flex-col gap-1 p-3">
      <a
        routerLink="/admin/dashboard"
        routerLinkActive="bg-indigo-50 text-indigo-800 shadow-sm dark:bg-indigo-950/70 dark:text-indigo-100 dark:shadow-md"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-semibold text-slate-700 transition-all duration-200 hover:-translate-y-0.5 hover:bg-white hover:shadow-md dark:text-slate-200 dark:hover:bg-slate-800/90 dark:hover:shadow-lg dark:hover:shadow-black/25"
      >
        <span class="material-icons-outlined">analytics</span>
        {{ 'nav.dashboard' | t }}
      </a>
      <a
        routerLink="/admin/owners"
        routerLinkActive="bg-indigo-50 text-indigo-800 shadow-sm dark:bg-indigo-950/70 dark:text-indigo-100 dark:shadow-md"
        class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-semibold text-slate-700 transition-all duration-200 hover:-translate-y-0.5 hover:bg-white hover:shadow-md dark:text-slate-200 dark:hover:bg-slate-800/90 dark:hover:shadow-lg dark:hover:shadow-black/25"
      >
        <span class="material-icons-outlined">manage_accounts</span>
        {{ 'nav.owners' | t }}
      </a>
    </nav>
    <div class="border-t border-slate-100 p-3 dark:border-slate-800">
      <div class="mb-3">
        <app-theme-toggle />
      </div>
      <button
        type="button"
        class="saas-btn-secondary flex w-full items-center justify-center gap-2 py-3 text-sm"
        (click)="signOut()"
      >
        <span class="material-icons-outlined text-lg">logout</span>
        {{ 'nav.signOut' | t }}
      </button>
    </div>
  </aside>

  <div class="flex min-w-0 flex-1 flex-col">
    <header
      class="sticky top-0 z-20 flex w-full items-center border-b border-white/60 bg-white/85 px-3 py-2.5 backdrop-blur-xl md:hidden dark:border-slate-700/70 dark:bg-slate-950/90 dark:backdrop-blur-xl"
    >
      <div class="flex w-full min-w-0 items-center justify-between gap-3">
        <button
          type="button"
          class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-800 shadow-sm transition-all hover:bg-slate-50 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100 dark:hover:bg-slate-700"
          (click)="openMobileMenu()"
          [attr.aria-label]="'a11y.openMenu' | t"
          [attr.aria-expanded]="mobileMenuOpen()"
        >
          <span class="material-icons-outlined text-2xl">menu</span>
        </button>
        <div class="relative shrink-0" data-admin-user-menu-root>
          <button
            type="button"
            class="flex h-10 w-10 items-center justify-center rounded-full bg-gradient-to-br from-indigo-600 to-blue-600 text-sm font-bold text-white shadow-md ring-2 ring-white dark:ring-slate-900"
            (click)="toggleUserMenu($event)"
            [attr.aria-expanded]="userMenuOpen()"
            [attr.aria-label]="'a11y.userMenu' | t"
          >
            {{ adminInitial() }}
          </button>
          @if (userMenuOpen()) {
            <div
              class="absolute right-0 top-12 z-50 min-w-[14rem] rounded-xl border border-slate-200/80 bg-white/95 p-2 shadow-xl backdrop-blur-xl dark:border-slate-600/80 dark:bg-slate-900/95 dark:shadow-black/40"
              role="menu"
            >
              <p class="border-b border-slate-100 px-3 py-2 text-xs text-slate-500 dark:border-slate-700 dark:text-slate-400">{{ 'auth.email' | t }}</p>
              <p class="px-3 pb-2 text-sm font-medium text-slate-900 break-all dark:text-slate-100">{{ profile()?.email }}</p>
              <button
                type="button"
                class="mt-1 flex w-full items-center gap-2 rounded-lg px-3 py-2.5 text-left text-sm font-semibold text-red-700 transition-colors hover:bg-red-50 dark:text-red-300 dark:hover:bg-red-950/40"
                role="menuitem"
                (click)="signOut()"
              >
                <span class="material-icons-outlined text-lg">logout</span>
                {{ 'auth.logout' | t }}
              </button>
            </div>
          }
        </div>
      </div>
    </header>

    @if (mobileMenuOpen()) {
      <div
        class="fixed inset-0 z-40 md:hidden"
        role="dialog"
        aria-modal="true"
        [attr.aria-label]="'a11y.navMenu' | t"
      >
        <div class="absolute inset-0 bg-slate-900/45 backdrop-blur-sm" (click)="closeMobileMenu()"></div>
        <aside
          class="absolute left-0 top-0 flex h-full w-[min(18rem,88vw)] flex-col border-r border-white/60 bg-white/95 shadow-2xl backdrop-blur-xl dark:border-slate-700/70 dark:bg-slate-950/95 dark:shadow-black/40"
          (click)="$event.stopPropagation()"
        >
          <div class="flex items-center justify-between border-b border-slate-100 px-4 py-4 dark:border-slate-800">
            <div class="min-w-0 pr-2">
              <p class="bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-xs font-semibold uppercase tracking-wide text-transparent">
                {{ 'nav.menu' | t }}
              </p>
              <p class="truncate text-sm font-semibold text-slate-900 dark:text-slate-100">{{ profile()?.name }}</p>
            </div>
            <button
              type="button"
              class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800"
              (click)="closeMobileMenu()"
              [attr.aria-label]="'a11y.closeMenu' | t"
            >
              <span class="material-icons-outlined text-2xl">close</span>
            </button>
          </div>
          <nav class="flex flex-1 flex-col gap-1 overflow-y-auto p-3">
            <a
              routerLink="/admin/dashboard"
              routerLinkActive="bg-indigo-50 text-indigo-800 shadow-sm dark:bg-indigo-950/70 dark:text-indigo-100 dark:shadow-md"
              [routerLinkActiveOptions]="{ exact: true }"
              class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-semibold text-slate-700 transition-all hover:bg-slate-100 dark:text-slate-200 dark:hover:bg-slate-800/80"
              (click)="closeMobileMenu()"
            >
              <span class="material-icons-outlined">analytics</span>
              {{ 'nav.dashboard' | t }}
            </a>
            <a
              routerLink="/admin/owners"
              routerLinkActive="bg-indigo-50 text-indigo-800 shadow-sm dark:bg-indigo-950/70 dark:text-indigo-100 dark:shadow-md"
              class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-semibold text-slate-700 transition-all hover:bg-slate-100 dark:text-slate-200 dark:hover:bg-slate-800/80"
              (click)="closeMobileMenu()"
            >
              <span class="material-icons-outlined">manage_accounts</span>
              {{ 'nav.owners' | t }}
            </a>
          </nav>
          <div class="border-t border-slate-100 p-3 dark:border-slate-800">
            <app-theme-toggle />
          </div>
        </aside>
      </div>
    }

    <main class="flex-1 p-4 md:p-6 lg:p-8 dark:bg-slate-950/50">
      <router-outlet />
    </main>
  </div>
</div>
