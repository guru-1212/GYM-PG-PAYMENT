<div class="flex min-h-screen bg-slate-50">
  <aside class="hidden w-56 shrink-0 flex-col border-r border-slate-200 bg-slate-900 text-white md:flex">
    <div class="border-b border-slate-800 px-4 py-5">
      <p class="text-xs font-semibold uppercase tracking-wide text-emerald-400">Admin</p>
      <p class="mt-1 truncate text-sm font-semibold">{{ profile()?.name }}</p>
    </div>
    <nav class="flex flex-1 flex-col gap-1 p-3">
      <a
        routerLink="/admin/dashboard"
        routerLinkActive="bg-slate-800"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-semibold text-slate-200 hover:bg-slate-800/80"
      >
        <span class="material-icons-outlined text-slate-300">analytics</span>
        Dashboard
      </a>
      <a
        routerLink="/admin/owners"
        routerLinkActive="bg-slate-800"
        class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-semibold text-slate-200 hover:bg-slate-800/80"
      >
        <span class="material-icons-outlined text-slate-300">manage_accounts</span>
        Owners
      </a>
    </nav>
    <div class="border-t border-slate-800 p-3">
      <button
        type="button"
        class="flex w-full items-center justify-center gap-2 rounded-xl bg-slate-800 py-3 text-sm font-semibold hover:bg-slate-700"
        (click)="signOut()"
      >
        <span class="material-icons-outlined text-lg">logout</span>
        Sign out
      </button>
    </div>
  </aside>

  <div class="flex min-w-0 flex-1 flex-col">
    <header class="flex items-center justify-between bg-slate-900 px-4 py-3 text-white md:hidden">
      <p class="text-sm font-semibold">Admin</p>
      <button type="button" class="text-sm font-semibold underline" (click)="signOut()">Sign out</button>
    </header>
    <nav class="flex gap-2 overflow-x-auto border-b border-slate-200 bg-white px-2 py-2 md:hidden">
      <a
        routerLink="/admin/dashboard"
        routerLinkActive="bg-slate-900 text-white"
        [routerLinkActiveOptions]="{ exact: true }"
        class="shrink-0 rounded-lg px-3 py-2 text-sm font-semibold text-slate-700"
        >Dashboard</a
      >
      <a
        routerLink="/admin/owners"
        routerLinkActive="bg-slate-900 text-white"
        class="shrink-0 rounded-lg px-3 py-2 text-sm font-semibold text-slate-700"
        >Owners</a
      >
    </nav>
    <main class="flex-1 p-4 md:p-8">
      <router-outlet />
    </main>
  </div>
</div>
