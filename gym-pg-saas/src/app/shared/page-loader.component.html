@if (isLoading()) {
  <div class="page-loader-overlay">
    <div class="loader-container">
      <div class="spinner">
        <div class="spinner-circle"></div>
        <div class="spinner-circle"></div>
        <div class="spinner-circle"></div>
        <div class="spinner-circle"></div>
      </div>
      <div class="loading-text">
        <p class="primary-text">Loading...</p>
        <p class="secondary-text">Please wait while we fetch your data</p>
      </div>
    </div>
  </div>
}
