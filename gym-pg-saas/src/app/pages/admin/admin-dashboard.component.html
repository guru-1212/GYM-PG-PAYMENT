<div class="mx-auto max-w-4xl space-y-6">
  <div>
    <h1 class="text-2xl font-bold text-slate-900">Admin dashboard</h1>
    <p class="text-slate-600">Overview of gym and PG owners.</p>
  </div>

  <div class="grid gap-4 sm:grid-cols-3">
    <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
      <p class="text-sm font-medium text-slate-500">Total owners</p>
      <p class="mt-2 text-3xl font-bold text-slate-900">{{ stats().total }}</p>
    </div>
    <div class="rounded-2xl border border-amber-200 bg-amber-50 p-5 shadow-sm">
      <p class="text-sm font-medium text-amber-800">Pending approvals</p>
      <p class="mt-2 text-3xl font-bold text-amber-900">{{ stats().pending }}</p>
    </div>
    <div class="rounded-2xl border border-emerald-200 bg-emerald-50 p-5 shadow-sm">
      <p class="text-sm font-medium text-emerald-800">Approved owners</p>
      <p class="mt-2 text-3xl font-bold text-emerald-900">{{ stats().approved }}</p>
    </div>
  </div>
</div>
